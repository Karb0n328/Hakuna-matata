<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1b33" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Hakuna Matata" />
  <link rel="manifest" href="./manifest.webmanifest?v=home-icon-v3" />
  <link rel="apple-touch-icon" href="./icons/hakuna-brand-v3.png?v=ios-home-v5" />
  <link rel="icon" type="image/png" href="./icons/hakuna-brand-v3.png?v=ios-home-v5" />
  <link rel="shortcut icon" href="./icons/hakuna-brand-v3.png?v=ios-home-v5" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://zyrbbkbwrijnnykbgjvc.supabase.co" crossorigin />
  <title>Hakuna Matata</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./performance.css?v=1" />
  <link rel="stylesheet" href="./mata.css" />
  <link rel="stylesheet" href="./ui-fixes.css" />
  <link rel="stylesheet" href="./today-agenda.css" />
  <link rel="stylesheet" href="./fixed-sidebar.css?v=1" />
  <link rel="stylesheet" href="./batu-dark-mode-v2.css?v=1" />
  <link rel="stylesheet" href="./yks-calculator.css?v=4" />
  <link rel="stylesheet" href="./yks-quota.css?v=1" />
  <link rel="stylesheet" href="./study-timer-v2.css?v=1" />
</head>
<body>
  <div id="app" class="app-shell">
    <aside class="sidebar" aria-label="Ana menü">
      <div class="brand">
        <img class="brand-icon" src="./icons/hakuna-brand-v3.png?v=brand-v3" width="46" height="46" alt="Hakuna Matata" />
        <div>
          <div class="brand-title">Hakuna Matata</div>
          <div class="brand-subtitle">Planla. Bitir. Devam et.</div>
        </div>
      </div>
      <nav id="sidebarNav" class="nav-list"></nav>
      <div class="sidebar-foot">
        <div class="tiny-pill"><span>☁︎</span> Veriler bu cihazda</div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div>
          <div id="pageEyebrow" class="eyebrow">Hazırlanıyor</div>
          <h1 id="pageTitle">Bugün</h1>
        </div>
        <div id="topbarActions" class="topbar-actions"></div>
      </header>
      <section id="view" class="view">
        <section class="card" data-hakuna-boot-placeholder>
          <div class="card-body" style="padding:22px">
            <div class="card-title">Hakuna açılıyor…</div>
            <div class="card-subtitle" style="margin-top:6px">Programın cihazdan yükleniyor.</div>
          </div>
        </section>
      </section>
    </main>

    <nav id="bottomNav" class="bottom-nav" aria-label="Mobil menü"></nav>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>

  <template id="modalTemplate">
    <div class="modal-backdrop" data-close-modal>
      <section class="modal-card" role="dialog" aria-modal="true" onclick="event.stopPropagation()">
        <header class="modal-head">
          <div>
            <div class="eyebrow modal-eyebrow"></div>
            <h2 class="modal-title"></h2>
          </div>
          <button class="icon-button" data-close-modal aria-label="Kapat">✕</button>
        </header>
        <div class="modal-body"></div>
      </section>
    </div>
  </template>

  <script type="module" src="./main.js?v=mata-complete-1"></script>
  <script src="./last-seen-v2.js?v=1" defer></script>
  <script src="./admin-panel-v2.js?v=1" defer></script>
  <script src="./batu-dark-mode-v2.js?v=1" defer></script>
  <script src="./ui-fixes.js?v=perf1" defer></script>
  <script src="./today-agenda.js?v=perf1" defer></script>
  <script src="./today-marker-fix.js?v=perf1" defer></script>
  <script src="./yks-calculator.js?v=6" defer></script>
  <script src="./yks-quota.js?v=1" defer></script>
  <script src="./study-timer-v2.js?v=1" defer></script>
</body>
</html>
