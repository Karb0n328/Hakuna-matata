  <meta name="theme-color" content="#0f1b33" />
  <script>
    // Some Supabase projects redirect email links to Site URL (home) instead
    // of the requested nested redirect URL. Forward recovery credentials
    // immediately, before the normal application's auth code initializes.
    (() => {
      const hash = new URLSearchParams(location.hash.slice(1));
      const query = new URLSearchParams(location.search);
      const recovery = hash.get('type') === 'recovery'
        || (query.get('type') === 'recovery' && (query.has('token_hash') || query.has('code')))
        || (hash.has('error_code') && hash.has('error_description'));
      if(!recovery)return;
      const target = new URL('./reset-password.html',location.href);
      target.hash = location.hash;
      target.search = location.search;
      location.replace(target.href);
    })();
  </script>
