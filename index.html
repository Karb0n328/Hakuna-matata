<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1b33" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Hakuna Matata" />
  <link rel="manifest" href="./manifest.webmanifest?v=final-logo-v2" />
  <link rel="apple-touch-icon" sizes="192x192" href="./icons/hakuna-final.png?v=final-logo-v2" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/hakuna-final.png?v=final-logo-v2" />
  <title>Hakuna Matata</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./mata.css" />
  <link rel="stylesheet" href="./ui-fixes.css" />
  <link rel="stylesheet" href="./today-agenda.css" />
  <link rel="stylesheet" href="./fixed-sidebar.css?v=1" />
</head>
<body>
  <div id="app" class="app-shell">
    <aside class="sidebar" aria-label="Ana menü">
      <div class="brand">
        <img class="brand-icon" src="./icons/hakuna-brand-v3.png?v=brand-v3" width="46" height="46" alt="Hakuna Matata" />
        <div>
          <div class="brand-title">Hakuna Matata</div>
          <div class="brand-subtitle">Planla. Bitir. Devam et.</div>
        </div>
      </div>
      <nav id="sidebarNav" class="nav-list"></nav>
      <div class="sidebar-foot">
        <div class="tiny-pill"><span>☁︎</span> Veriler bu cihazda</div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div>
          <div id="pageEyebrow" class="eyebrow"></div>
          <h1 id="pageTitle">Bugün</h1>
        </div>
        <div id="topbarActions" class="topbar-actions"></div>
      </header>
      <section id="view" class="view"></section>
    </main>

    <nav id="bottomNav" class="bottom-nav" aria-label="Mobil menü"></nav>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>

  <template id="modalTemplate">
    <div class="modal-backdrop" data-close-modal>
      <section class="modal-card" role="dialog" aria-modal="true" onclick="event.stopPropagation()">
        <header class="modal-head">
          <div>
            <div class="eyebrow modal-eyebrow"></div>
            <h2 class="modal-title"></h2>
          </div>
          <button class="icon-button" data-close-modal aria-label="Kapat">✕</button>
        </header>
        <div class="modal-body"></div>
      </section>
    </div>
  </template>

  <script type="module" src="./main.js?v=mata-brain-v3-1"></script>
  <script src="./ui-fixes.js" defer></script>
  <script src="./today-agenda.js" defer></script>
  <script src="./today-marker-fix.js" defer></script>
</body>
</html>
