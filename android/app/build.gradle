plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hakunamatata.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.hakunamatata.app'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '1.0.6'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
