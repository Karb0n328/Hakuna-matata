name: Guidance planner copy and drag
on:
  push:
    paths:
      - guidance-weekly.js
      - guidance-v1.js
      - guidance-weekly-v4.css
      - tests/guidance-page-isolation.test.cjs
      - tests/guidance-weekly.test.cjs
      - .github/workflows/guidance-weekly.yml
  pull_request:
    paths:
      - guidance-weekly.js
      - guidance-v1.js
      - guidance-weekly-v4.css
      - tests/guidance-page-isolation.test.cjs
      - tests/guidance-weekly.test.cjs
      - .github/workflows/guidance-weekly.yml
permissions:
  contents: read
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check guidance-weekly.js && node --check guidance-v1.js && node --check tests/guidance-page-isolation.test.cjs
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: node tests/guidance-weekly.test.cjs
      - run: node tests/guidance-page-isolation.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guidance-screenshots
          path: test-results/
