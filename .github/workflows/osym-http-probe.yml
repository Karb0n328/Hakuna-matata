name: Diagnose official ÖSYM PDF range access
on:
  push:
    branches: [feature/osym-pdf-range-debug]
    paths:
      - evaluation/probe_osym_http.py
      - .github/workflows/osym-http-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe HTTP headers and magic bytes only
        run: python evaluation/probe_osym_http.py
