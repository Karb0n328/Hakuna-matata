name: Question crop — Chromium and iPad WebKit
on:
  push:
    paths:
      - question-books.js
      - question-books.css
      - tests/question-crop-ui.test.mjs
      - .github/workflows/question-crop-browser.yml
  pull_request:
    paths:
      - question-books.js
      - question-books.css
      - tests/question-crop-ui.test.mjs
      - .github/workflows/question-crop-browser.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  crop-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check for core image editor and UI test
        run: |
          node --check question-books.js
          node --check tests/question-crop-ui.test.mjs
      - name: Install browser test tool
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Install Chromium and WebKit including iPad rendering dependencies
        run: npx playwright install --with-deps chromium webkit
      - name: Verify crop UI in browsers
        run: node tests/question-crop-ui.test.mjs
