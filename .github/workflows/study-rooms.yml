name: Hakuna study rooms verification
on:
  push:
    paths:
      - offline-support.js
      - guidance-v1.js
      - guidance-weekly.js
      - question-books.js
      - tests/offline-browser.test.cjs
      - app.js
      - main.js
      - index.html
      - sw.js
      - account-sync-v2.js
      - study-rooms.js
      - study-rooms.css
      - study-rooms-immersive.css
      - room-experience.js
      - room-weather.js
      - room-experience.css
      - tests/study-rooms-unit.test.cjs
      - tests/study-rooms-browser.test.cjs
      - supabase/migrations/20261105_study_rooms.sql
      - .github/workflows/study-rooms.yml
  pull_request:
    paths:
      - offline-support.js
      - guidance-v1.js
      - guidance-weekly.js
      - question-books.js
      - tests/offline-browser.test.cjs
      - app.js
      - main.js
      - index.html
      - sw.js
      - account-sync-v2.js
      - study-rooms.js
      - study-rooms.css
      - study-rooms-immersive.css
      - room-experience.js
      - room-weather.js
      - room-experience.css
      - tests/study-rooms-unit.test.cjs
      - tests/study-rooms-browser.test.cjs
      - supabase/migrations/20261105_study_rooms.sql
      - .github/workflows/study-rooms.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rooms:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify scripts and deterministic room logic
        run: |
          node --check app.js
          node --check main.js
          node --check sw.js
          node --check study-rooms.js
          node --check room-experience.js
          node --check room-weather.js
          node --check account-sync-v2.js
          node --check tests/study-rooms-unit.test.cjs
          node --check tests/study-rooms-browser.test.cjs
          node tests/study-rooms-unit.test.cjs
      - name: Install browser test runner
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Verify real offline app launch and persisted work
        run: node tests/offline-browser.test.cjs
      - name: Run desktop, iPhone and iPad room flows
        run: node tests/study-rooms-browser.test.cjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: room-experience-screenshots
          path: test-results/
