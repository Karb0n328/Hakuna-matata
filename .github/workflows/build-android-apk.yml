name: Build Hakuna Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'icons/hakuna-final.png'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Android launcher icons
        shell: bash
        run: |
          set -euo pipefail
          SRC="icons/hakuna-final.png"
          test -f "$SRC"

          rm -rf android/app/src/main/res/mipmap android/app/src/main/res/mipmap-* \
                 android/app/src/main/res/drawable/hakuna_logo.png

          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26

          # Keep the final Hakuna artwork opaque. The old build tried to make
          # dark pixels transparent, which could make the launcher icon vanish.
          cp "$SRC" android/app/src/main/res/drawable/hakuna_logo.png

          if command -v convert >/dev/null 2>&1; then
            convert "$SRC" -alpha off -resize 48x48\!   android/app/src/main/res/mipmap-mdpi/ic_launcher.png
            convert "$SRC" -alpha off -resize 72x72\!   android/app/src/main/res/mipmap-hdpi/ic_launcher.png
            convert "$SRC" -alpha off -resize 96x96\!   android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
            convert "$SRC" -alpha off -resize 144x144\! android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            convert "$SRC" -alpha off -resize 192x192\! android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          else
            cp "$SRC" android/app/src/main/res/mipmap-mdpi/ic_launcher.png
            cp "$SRC" android/app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp "$SRC" android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp "$SRC" android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp "$SRC" android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          fi

          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp "android/app/src/main/res/mipmap-$d/ic_launcher.png" \
               "android/app/src/main/res/mipmap-$d/ic_launcher_round.png"
          done

          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/hakuna_launcher_background" />
              <foreground android:drawable="@drawable/hakuna_logo" />
          </adaptive-icon>
          EOF

          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/hakuna_launcher_background" />
              <foreground android:drawable="@drawable/hakuna_logo" />
          </adaptive-icon>
          EOF

          echo "Generated launcher resources:"
          find android/app/src/main/res -type f \( -name 'ic_launcher*' -o -name 'hakuna_logo.png' \) -print

      - name: Build APK
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - name: Verify launcher icon is packaged
        shell: bash
        run: |
          set -euo pipefail
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -E 'ic_launcher|hakuna_logo' | tee /tmp/icon-list.txt
          test -s /tmp/icon-list.txt

      - name: Prepare artifact
        run: cp android/app/build/outputs/apk/debug/app-debug.apk 'Hakuna Matata.apk'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hakuna-Matata-APK
          path: Hakuna Matata.apk
          retention-days: 30
