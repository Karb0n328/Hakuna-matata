name: Build Hakuna Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare app icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp icons/hakuna-final.png android/app/src/main/res/drawable/hakuna_logo.png

      - name: Build APK
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - name: Prepare artifact
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Hakuna-Matata.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hakuna-Matata-APK
          path: Hakuna-Matata.apk
          retention-days: 30
