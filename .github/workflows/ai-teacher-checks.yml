name: AI teacher pilot checks
on:
  pull_request:
    paths:
      - ai-teacher.js
      - ai-teacher.css
      - main.js
      - sw.js
      - supabase/functions/hakuna-teacher/**
      - .github/workflows/ai-teacher-checks.yml
  push:
    paths:
      - .github/workflows/ai-teacher-checks.yml
      - ai-teacher.js
      - ai-teacher.css
      - main.js
      - sw.js
      - supabase/functions/hakuna-teacher/**
jobs:
  client-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: |
          node --check ai-teacher.js
          node --check main.js
          node --check sw.js
      - name: Pilot-only authorization guard
        run: |
          grep -Fq 'if(user.id!==BATU)' supabase/functions/hakuna-teacher/index.ts
          grep -Fq 'if(granted&&!button)build()' ai-teacher.js
  edge-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check function types
        run: deno check supabase/functions/hakuna-teacher/index.ts
      - name: Run deterministic verification tests
        run: |
          deno test supabase/functions/hakuna-teacher/verification_test.ts
          deno test supabase/functions/hakuna-teacher/retrieval_test.ts
          deno test supabase/functions/hakuna-teacher/math-proof_test.ts
          deno test supabase/functions/hakuna-teacher/answers_test.ts
          deno test supabase/functions/hakuna-teacher/safety_test.ts
          deno test supabase/functions/hakuna-teacher/benchmark_test.ts
          deno test supabase/functions/hakuna-teacher/original_benchmark_test.ts
